name: Sync GYG Bookings to Airtable

on:
  schedule:
    # Runs every hour at minute 0
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger anytime from the Actions tab

concurrency:
  group: gyg-sync-airtable
  cancel-in-progress: false

jobs:
  sync-bookings:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright & OS Dependencies
        run: |
          playwright install --with-deps chromium

      - name: Run Bookings Sync (Upcoming 7 Days + Recent 50)
        env:
          GYG_LOGIN_EMAIL: ${{ secrets.GYG_LOGIN_EMAIL }}
          GYG_LOGIN_PASSWORD: ${{ secrets.GYG_LOGIN_PASSWORD }}
          GYG_TOTP_SECRET: ${{ secrets.GYG_TOTP_SECRET }}
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_NAME: ${{ secrets.AIRTABLE_TABLE_NAME }}
          PORTAL_TIMEZONE: "Africa/Cairo"
          HEADLESS: "true"
          DRY_RUN: "false"
        run: |
          python -m src.booking_sync.jobs.sync_all

      - name: Upload Debug Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-artifacts
          path: |
            *.png
            *.html
            *.log
          retention-days: 7
